<!DOCTYPE html>
<html>
<head>
    <title>Transaction Risk Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 40px;
        }
        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 25px;
        }

        .result {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .box {
            background: #f1f3f5;
            margin: 12px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
        }

        .recommendation {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Transaction Analysis Result</h1>

    <div class="result">
        {{ result }}
    </div>

    <div class="box">
        <strong>Fraud Probability:</strong>
        {{ probability }}%
    </div>

    <div class="box">
        <strong>Financial Risk Score:</strong>
        {{ risk_score }}/100
    </div>

    <div class="box">
        <strong>Risk Level:</strong>
        {{ risk_level }}
    </div>

    <div class="recommendation">
        <strong>Recommendation:</strong>
        <br><br>
        {{ recommendation }}
    </div>

    <a href="/">Check Another Transaction</a>

</div>

</body>
</html>
